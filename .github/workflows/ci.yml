name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'
  PNPM_VERSION: '10.0.0'

jobs:
  quality-and-postgres:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: finanzas_personales_ci_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d finanzas_personales_ci_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --dir apps/api prisma:generate

      - name: API typecheck
        run: pnpm --dir apps/api typecheck

      - name: API tests
        run: pnpm --dir apps/api test

      - name: API build
        run: pnpm --dir apps/api build

      - name: Web typecheck
        run: pnpm --dir apps/web typecheck

      - name: Web tests
        run: pnpm --dir apps/web test

      - name: Web build
        run: pnpm --dir apps/web build

      - name: Check PostgreSQL service health
        run: |
          container_id="$(docker ps -q --filter ancestor=postgres:16)"
          test -n "$container_id"
          test "$(docker inspect --format='{{.State.Health.Status}}' "$container_id")" = healthy
          docker exec "$container_id" pg_isready -U ci -d finanzas_personales_ci_integration

      - name: PostgreSQL ownership integration
        env:
          RUN_POSTGRES_INTEGRATION: 'true'
          INTEGRATION_DATABASE_IS_EPHEMERAL: 'true'
          INTEGRATION_DATABASE_CONFIRM: finanzas-personales-ephemeral
          INTEGRATION_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/finanzas_personales_ci_integration
          INTEGRATION_DATABASE_NAME: finanzas_personales_ci_integration
          INTEGRATION_DATABASE_PORT: '5432'
          DATABASE_URL: ''
        run: pnpm --dir apps/api exec vitest run src/integration/authOwnershipPostgres.integration.test.ts
